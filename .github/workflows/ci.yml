name: CI

# Feature branches get CI only through a pull request, so a PR push does not run it twice.
on:
  push:
    branches: [main]
  pull_request:

# The token needs to read the repository and nothing else; fork pull requests get it read-only anyway.
permissions:
  contents: read

# A new push to the same pull request cancels the run it replaces; main runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # testcontainers uses the Docker daemon already on the runner.
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The OpenAPI drift check dumps the backend's schema, so this job also needs Python and uv.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: npm ci
      - run: npm test
      - name: OpenAPI types match the backend
        run: npm run api:types && git diff --exit-code -- lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run bundle-size

  # Informational: not a required check until it has been green on main ten times in a row.
  # The same script runs locally (`web/scripts/e2e-stack.sh --fresh`); its step times go to the
  # job summary. One job per browser, in parallel: each runner builds its own stack and database
  # and installs only its browser, so a run takes one browser's time instead of all three.
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Local-only environment for Compose
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_USER=.*/POSTGRES_USER=queueless/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/; s/^POSTGRES_DB=.*/POSTGRES_DB=queueless/" .env
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: web
      - run: web/scripts/e2e-stack.sh --fresh
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
      - if: failure()
        run: docker compose logs --no-color api worker web
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-${{ matrix.browser }}
          path: web/test-results/
          retention-days: 7
