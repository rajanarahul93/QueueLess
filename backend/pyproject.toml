[project]
name = "queueless-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.153.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.1",
    "sqlalchemy[asyncio]==2.1.5",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "arq==0.28.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "testcontainers[postgres]==4.15.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[tool.uv]
# The app runs from source (cwd = backend/), it is not installed as a package.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
